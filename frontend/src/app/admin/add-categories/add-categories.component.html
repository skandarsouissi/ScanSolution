<div class="category-container">
  <h2>{{ pageTitle }}</h2>
  
  <form [formGroup]="categoryForm" class="category-form">
    <div class="form-group">
      <label for="category-name">Nom de la catégorie :</label>
      <input
        type="text"
        id="category-name"
        formControlName="name"
        placeholder="Entrez le nom"
        required
      />
      <div *ngIf="categoryForm.get('name')?.invalid && categoryForm.get('name')?.touched" style="color:red;">
        Le nom est obligatoire (3 caractères minimum).
      </div>
    </div>

    <div class="form-group">
      <label for="is-active">
        <input type="checkbox" id="is-active" formControlName="isActive" />
        Actif
      </label>
    </div>

    <div class="form-actions">
      <button 
        (click)="postCategory()" 
        type="submit" 
        [disabled]="categoryForm.invalid || isLoading"
        class="btn btn-primary">
        {{ buttonText }}
      </button>
      
      <button 
        type="button" 
        (click)="goBack()" 
        class="btn btn-secondary">
        Annuler
      </button>
    </div>
  </form>
</div>
